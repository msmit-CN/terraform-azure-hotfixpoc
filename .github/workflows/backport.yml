name: backport

# Label a merged PR on main with "backport release/vN" to open a cherry-pick PR to that branch.
on:
  pull_request_target:
    types: [closed, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    if: >-
      github.event.pull_request.merged == true &&
      contains(toJSON(github.event.pull_request.labels.*.name), '"backport ')
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.APP_ID != '' }}
    steps:
      # App token (not GITHUB_TOKEN) so the backport PR triggers the required checks.
      - name: Generate App Token
        id: app-token
        if: ${{ env.HAS_APP == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # Only cherry-picks already-merged commits; never runs PR code.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: korthout/backport-action@8560fb503c275d433c56f05a2f64850093baa9f7 # v4.7.0
        with:
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          label_pattern: '^backport ([^ ]+)$'
          pull_title: '${pull_title}'
          pull_description: 'Backport of #${pull_number} to `${target_branch}`.'
